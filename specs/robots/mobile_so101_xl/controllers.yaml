# ros2_control controllers (upstream ros2_controllers only), loaded by gz_ros2_control: mobile_so101's, with the arm and
# jaw gains for the 2x arm. The controller manager runs every 1 ms physics step. Base: omni_wheel_drive_controller
# (~/cmd_vel: geometry_msgs/TwistStamped, robot frame), as mobile_panda. Arm and jaw: joint_trajectory_controller on
# effort with PID gains (the gz_ros2_control effort demo layout); no gravity compensation, the I terms absorb gravity;
# the joint damping is in the URDF (robot.urdf.xacro, implicit in MuJoCo), so no D terms.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true
    # MuJoCo enforces the joint ranges and effort limits itself; ros2_control's limiter would log an ERROR every
    # time an effort-controlled joint rests on a limit (the closed or fully open jaw).
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_drive_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

omni_wheel_drive_controller:
  ros__parameters:
    # anticlockwise from the first wheel, which sits at wheel_offset from +x (X layout: front-left at 45 deg)
    wheel_offset: 0.7853981633974483
    wheel_names: [front_left_wheel_joint, rear_left_wheel_joint, rear_right_wheel_joint, front_right_wheel_joint]
    robot_radius: 0.22
    wheel_radius: 0.0776   # effective rolling radius (0.08 rim minus the sphere-roller dip), calibrated
    odom_frame_id: odom
    tf_frame_prefix: "~"   # the controller's namespace (none here): frames stay odom / base_footprint
    base_frame_id: base_footprint
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5

arm_controller:
  ros__parameters:
    joints: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    # p: mobile_so101's x 16 (the gravity torque grows as s^4; the old mobile_so101_xl's kp); i = p / 0.25 s.
    # u_clamp 80 N m: mobile_so101's 5 N m x 16.
    gains:
      shoulder_pan: {p: 960.0, i: 3840.0, d: 0.0, i_clamp_max: 80.0, i_clamp_min: -80.0, u_clamp_max: 80.0, u_clamp_min: -80.0,
                     antiwindup_strategy: conditional_integration}
      shoulder_lift: {p: 960.0, i: 3840.0, d: 0.0, i_clamp_max: 80.0, i_clamp_min: -80.0, u_clamp_max: 80.0, u_clamp_min: -80.0,
                      antiwindup_strategy: conditional_integration}
      elbow_flex: {p: 640.0, i: 2560.0, d: 0.0, i_clamp_max: 80.0, i_clamp_min: -80.0, u_clamp_max: 80.0, u_clamp_min: -80.0,
                   antiwindup_strategy: conditional_integration}
      wrist_flex: {p: 320.0, i: 1280.0, d: 0.0, i_clamp_max: 80.0, i_clamp_min: -80.0, u_clamp_max: 80.0, u_clamp_min: -80.0,
                   antiwindup_strategy: conditional_integration}
      wrist_roll: {p: 160.0, i: 640.0, d: 0.0, i_clamp_max: 80.0, i_clamp_min: -80.0, u_clamp_max: 80.0, u_clamp_min: -80.0,
                   antiwindup_strategy: conditional_integration}

gripper_controller:
  ros__parameters:
    joints: [gripper]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    # u_clamp 1.9 N m: ~12 N squeeze at the jaw tip pads (0.158 m from the jaw axis; the old mobile_so101_xl's force);
    # p: the old mobile_so101_xl's jaw kp
    gains:
      gripper: {p: 16.0, i: 0.0, d: 0.0, u_clamp_max: 1.9, u_clamp_min: -1.9}
