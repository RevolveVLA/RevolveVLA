# Phase-wise recovery of the failed phases of an evaluation run of open_drawer (mobile_so101_xl): the failures are read from their
# bags, restarted at the start of the failed phase (the drawer must still be closed there) and recorded again by the MoveIt generator
# (AutoMoMa plans the fridge only). `./revolve recover specs/recovery/drawer_so101xl.yaml [collect|run|check|all] [--dry-run]`;
# needs the simulator image, the assets and a GPU, and a finished `./revolve evaluate specs/eval/drawer_so101xl_v2.yaml`.
task: open_drawer
robot: mobile_so101_xl
from: {eval: runs/eval/drawer_so101xl_v2}
triggers:
  - {plugin: verdict}
  - {plugin: stall, phases: [approach], window_s: 3, min_motion: 0.01}
phases:
  restart_from: phase_start
  max_object_joint: 0.02                       # unreproducible when the drawer is open beyond this [m]
  generator: {plugin: moveit, attempts: 3, record: no-images}
  per_failure: 2
  quota: {approach: 20, grasp: 0, open: 10}    # grasp: moveit's resume cannot meet the timer of a grasp phase started from its start
keep: successes
seed: 0
run: {workers: 2, reset: warm, headless: true}
out: runs/recovery/drawer_so101xl
