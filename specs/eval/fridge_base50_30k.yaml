# The 30k SmolVLA checkpoint on 10 held-out fridge-door configs (inside the training ranges of specs/datagen/fridge_base50.yaml,
# >= 0.1 away from its training configs, sampled and realised) and 10 training starts. `./revolve evaluate specs/eval/fridge_base50_30k.yaml [--dry-run]`
train: specs/datagen/fridge_base50.yaml        # task, robot, randomisers, generator, seed
training: {plugin: legacy_layouts, run: runs/fridge_base50}      # the run the 30k ckpt was trained on (read only; no datagen manifest)
ckpt: {source: local, path: runs/ckpts/modal_smolvla30k_030000}
# ckpt: {source: hf, repo: org/name, revision: main, subfolder: checkpoints/030000/pretrained_model}
policy: {plugin: smolvla}
out: runs/eval/fridge_base50_30k
sets:
  heldout:
    count: 10
    sampler: {strategy: sobol}
    pool: {initial: [510, 529], replacement: [530, 599]}      # 500-509 were the earlier held-out seeds
    min_distance: {value: 0.1, realised: true}
  train: {from: train, count: 10}
rollouts: 2                                    # per config
retries: 1                                     # policy again from the failed phase start, up to N times
runner: {n_action_steps: 20, chunk_size_threshold: 0}      # 20 executed per chunk, no overlap = no ensembling
# runner: {n_action_steps: 10, chunk_size_threshold: 0.5, temporal_ensembling: {aggregate: weighted_average}}   # aggregate: weighted_average|latest_only|average|conservative
judge: {criterion: c2}
run: {workers: 2, headless: true}
