# PRD 11 GPU matrix row st: stages + --set: 1 held-out + 1 train, oracle
train: specs/datagen/fridge_base50.yaml
training: {plugin: legacy_layouts, run: runs/fridge_base50}
out: runs/eval/m_st
policy: {plugin: oracle}
sets:
  heldout:
    count: 1
    sampler: {strategy: sobol}
    pool: {initial: [500, 504]}
    min_distance: {value: 0.1, realised: false}
  train: {from: train, count: 1}
rollouts: 1
judge: {criterion: c2}
run: {workers: 1}
