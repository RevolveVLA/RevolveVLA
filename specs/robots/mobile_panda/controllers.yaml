# ros2_control controllers (upstream ros2_controllers only), loaded by gz_ros2_control. The controller manager
# runs every 1 ms physics step. Base: omni_wheel_drive_controller (~/cmd_vel: geometry_msgs/TwistStamped, robot
# frame). Arm and gripper: joint_trajectory_controller on effort with PID gains (the gz_ros2_control effort demo
# layout); no gravity compensation, the I terms absorb gravity. Names as in moveit_resources_panda_moveit_config.
controller_manager:
  ros__parameters:
    update_rate: 1000  # Hz
    use_sim_time: true
    # MuJoCo enforces the joint ranges and effort limits itself; ros2_control's limiter would log an ERROR every
    # time an effort-controlled joint rests on a limit (the open gripper).
    enforce_command_limits: false

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    omni_wheel_drive_controller:
      type: omni_wheel_drive_controller/OmniWheelDriveController

    panda_arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController

    panda_hand_controller:
      type: joint_trajectory_controller/JointTrajectoryController

omni_wheel_drive_controller:
  ros__parameters:
    # anticlockwise from the first wheel, which sits at wheel_offset from +x (X layout: front-left at 45 deg)
    wheel_offset: 0.7853981633974483
    wheel_names: [front_left_wheel_joint, rear_left_wheel_joint, rear_right_wheel_joint, front_right_wheel_joint]
    robot_radius: 0.22
    wheel_radius: 0.0776   # effective rolling radius (0.08 rim minus the sphere-roller dip), calibrated
    odom_frame_id: odom
    tf_frame_prefix: "~"   # the controller's namespace (none here): frames stay odom / base_footprint
    base_frame_id: base_footprint
    open_loop: false
    position_feedback: true
    enable_odom_tf: true
    cmd_vel_timeout: 0.5

panda_arm_controller:
  ros__parameters:
    joints: [panda_joint1, panda_joint2, panda_joint3, panda_joint4, panda_joint5, panda_joint6, panda_joint7]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    # The I terms (integral time 0.25 s) hold the arm against gravity. D stays low on joints 1 and 3: near q2 = 0
    # their axes line up and the mode they share has ~0.035 kg m^2 of inertia, so an explicit D above ~35 in total
    # goes unstable at the 1 ms step (D 75 + 25: a 1.7 deg limit cycle). u_clamp = the Panda's effort limits.
    gains:
      panda_joint1: {p: 940.0, i: 3760.0, d: 20.0, i_clamp_max: 87.0, i_clamp_min: -87.0, u_clamp_max: 87.0, u_clamp_min: -87.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint2: {p: 1250.0, i: 5000.0, d: 100.0, i_clamp_max: 87.0, i_clamp_min: -87.0, u_clamp_max: 87.0, u_clamp_min: -87.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint3: {p: 312.0, i: 1248.0, d: 12.0, i_clamp_max: 87.0, i_clamp_min: -87.0, u_clamp_max: 87.0, u_clamp_min: -87.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint4: {p: 437.0, i: 1748.0, d: 35.0, i_clamp_max: 87.0, i_clamp_min: -87.0, u_clamp_max: 87.0, u_clamp_min: -87.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint5: {p: 31.0, i: 124.0, d: 2.5, i_clamp_max: 12.0, i_clamp_min: -12.0, u_clamp_max: 12.0, u_clamp_min: -12.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint6: {p: 31.0, i: 124.0, d: 2.5, i_clamp_max: 12.0, i_clamp_min: -12.0, u_clamp_max: 12.0, u_clamp_min: -12.0,
                     antiwindup_strategy: conditional_integration}
      panda_joint7: {p: 6.0, i: 24.0, d: 0.5, i_clamp_max: 12.0, i_clamp_min: -12.0, u_clamp_max: 12.0, u_clamp_min: -12.0,
                     antiwindup_strategy: conditional_integration}

panda_hand_controller:
  ros__parameters:
    joints: [panda_finger_joint1]
    command_interfaces: [effort]
    state_interfaces: [position, velocity]
    allow_nonzero_velocity_at_trajectory_end: true
    gains:
      panda_finger_joint1: {p: 300.0, i: 0.0, d: 5.0, u_clamp_max: 12.0, u_clamp_min: -12.0}
