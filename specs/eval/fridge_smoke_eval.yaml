# GPU smoke of the eval pipeline: 1 held-out fridge-door config, 1 rollout, the oracle policy (the expert's own actions: no checkpoint),
# judged C2. `./revolve evaluate specs/eval/fridge_smoke_eval.yaml all`. No training manifest is needed: `realised: false`.
train: specs/datagen/fridge_base50.yaml
policy: {plugin: oracle}
out: runs/eval/fridge_smoke_eval
sets:
  heldout:
    count: 1
    sampler: {strategy: sobol}
    pool: {initial: [500, 504], replacement: [505, 529]}
    min_distance: {value: 0.1, realised: false}   # sampled distance to the re-sampled training configs (no training manifest)
rollouts: 1
retries: 0
judge: {criterion: c2}
run: {workers: 1, headless: true}
