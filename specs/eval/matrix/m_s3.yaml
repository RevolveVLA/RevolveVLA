# PRD 11 GPU matrix row s3: stratified sampler, bins 2x2x2
train: specs/datagen/fridge_base50.yaml
training: {plugin: legacy_layouts, run: runs/fridge_base50}
out: runs/eval/m_s3
policy: {plugin: oracle}
sets:
  heldout:
    count: 1
    sampler: {strategy: stratified, bins: {robot_base.x_m: 2, robot_base.y_m: 2, robot_base.yaw_deg: 2}}
    pool: {initial: [500, 504]}
    min_distance: {value: 0.1, realised: false}
rollouts: 1
judge: {criterion: c2}
