# Mobile SO-101: TheRobotStudio SO-101 arm (so101_new_calib.urdf, ThirdParty/so_arm100, Apache-2.0) on the
# virtual holonomic base, with a taller chassis box (arm mount 0.78 m, 5 cm inside the front edge) so it
# reaches the kitchen drawer bar. Simulator code: components/simulator/src/sim/robots/mobile_so101/.
name: mobile_so101
model: mobile_so101                   # gz model: joints are mobile_so101::<joint>
description: ThirdParty/so_arm100/Simulation/SO101/so101_new_calib.urdf   # submodule, read in place
joints:
  # state = base + arm + gripper; the gripper joint is the moving jaw's angle [rad] (URDF joint); the
  # action's gripper is the opening per contact link [m] (jaw gap / 2), converted to a jaw angle by the robot
  base: [base_x, base_y, base_yaw]
  arm: [shoulder_pan, shoulder_lift, elbow_flex, wrist_flex, wrist_roll]
  gripper: [gripper]
links:
  root: so101_base_link
  hand: so101_hand                    # massless frame link tcp.hand_offset_z behind the TCP
  on_chassis: [base_link, so101_base_link, shoulder_link]
# TCP between the jaw tips (an SDF frame on gripper_link): z out of the jaws, y from the moving jaw to the
# fixed jaw (robots/mobile_so101/robot.py TCP_IN_GRIPPER)
tcp: {link: so101_tcp, hand_offset_z: 0.1034}
mount: {xyz: [0.20, 0.0, 0.78]}       # so101_base_link (the arm's mounting face) ahead of the centre / above the floor
chassis: {size_xy: [0.50, 0.50], mass: 40.0}
base:
  kp: [6000.0, 6000.0, 800.0]
  damping: [1000.0, 1000.0, 150.0]
  f_max: [1000.0, 1000.0, 300.0]
  v_max: 0.4
  w_max: 0.6
  limits: [3.0, 3.0, 25.132741228718345]
arm:
  ready: [0.0, -1.57, 1.57, 0.0, 0.0]   # folded, forearm forward, tool horizontal (closing vertical)
  kp: [60.0, 60.0, 40.0, 20.0, 10.0]
  damping: [1.5, 1.5, 1.0, 0.6, 0.3]
  # above the STS3215 stall torque (2.94 N m at 12 V) so the feed-forward of the numerical damping does not
  # saturate on fast joint moves (3 N m: shoulder_lift lagged 58 deg on a 2.5 s move)
  tau_max: [5.0, 5.0, 5.0, 5.0, 5.0]
gripper:
  contact_links: [gripper_link, moving_jaw_so101_v1_link]   # (fixed jaw, moving jaw)
  hand_links: [gripper_link, moving_jaw_so101_v1_link]
  open_m: 0.020                       # 40 mm gap
  closed_m: 0.0
  force_n: 6.0                        # squeeze at the pads (cap of the jaw torque)
reach: {d_m: 0.33, bearing_rad: 0.0}  # TCP ahead of the shoulder_lift axis, in the arm's plane
contract: contract.yaml               # Rosetta contract
# Generated by the simulator (robots/mobile_so101/model.py + gen_camera_model.py) into the git-ignored runs/
camera_model: runs/models/mobile_so101/model.sdf
gz_sdf: runs/models/mobile_so101/model.sdf
# Training cameras (gen_camera_model.py, topic /mobile_so101/<name>/image). pose: x y z roll pitch yaw
# [m, rad] in the link frame. wrist_cam: MuJoCo Menagerie robotstudio_so101's wrist camera (fovy 61 deg).
cameras:
  - {name: wrist_cam, link: gripper_link, pose: [-0.00296, 0.05436, -0.05310, -3.140893, 0.991122, -1.560607],
     rate: 30, width: 480, height: 480, hfov: 1.064651, clip: [0.02, 10.0]}
  - {name: overhead_left_cam, link: base_link, pose: [0.10, 0.50, 1.80, 0, 1.117011, -1.570796],
     rate: 30, width: 480, height: 480, hfov: 1.68, clip: [0.05, 15.0]}
  - {name: overhead_right_cam, link: base_link, pose: [0.10, -0.50, 1.80, 0, 1.117011, 1.570796],
     rate: 30, width: 480, height: 480, hfov: 1.68, clip: [0.05, 15.0]}
# cuRobo planner fields (datagen). The jaw is locked at gripper.open_m (its joint target).
planner:
  collision_sphere_buffer: 0.005
  # Chassis box 0.50 x 0.50 x 0.775 m from z 0.005, base_link frame.
  base_spheres: {radius: 0.12, x: [-0.15, 0.0, 0.15], y: [-0.15, 0.0, 0.15], z: [0.15, 0.32, 0.48, 0.64]}
  base_self_collision_ignore: [so101_base_link, shoulder_link]
  # Order: base_x, base_y, base_yaw, the 5 arm joints, gripper
  cspace_distance_weight: [1, 1, 1, 1, 1, 1, 1, 1, 1]
  null_space_weight: [1, 1, 1, 1, 1, 1, 1, 1, 1]
  max_acceleration: 15.0
  max_jerk: 500.0
  # Recovery (plan_from_state) only: corner sphere columns as the mobile Panda's, up to this robot's taller
  # chassis (0.775 m). Exercised by the recovery tests (reach plans use them; a pull from a saved start that
  # collides under them drops them, as for the mobile Panda on the drawer).
  regen_base_corner_spheres: {radius: 0.07, xy: 0.205, z: [0.12, 0.24, 0.36, 0.48, 0.60, 0.70]}
