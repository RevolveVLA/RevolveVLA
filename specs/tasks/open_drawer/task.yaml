# Open the top drawer of the PartNet-Mobility cabinet 46452 (kitchen_counter, against the west wall, front facing
# east). The drawer's slide middle_slide_top: 0 closed, opens positive (out of the cabinet) to 0.35 m.
name: open_drawer
scene: kitchen_partnet
prompt: open the top drawer of the cabinet
targets:
  # the 13 x 624 x 14 mm bar (a collision on link drawer2_top); its frame = the cabinet's at the closed drawer:
  # x out of the cabinet front, y along the bar
  handle: kitchen_counter::drawer2_top::drawer2_top_handle_bar
budget_s: 45.0                      # the whole episode [s]: the phase timeouts add up to 40 s
phases:
  - name: approach                  # drive + reach: the TCP on the bar, the gripper pointing into the drawer
    timeout_s: 20.0
    done:
      - {metric: distance, from: robot::tcp, to: handle, le: 0.015}
      - {metric: angle, from: robot::tcp, to: handle, axes: [z, -x], le: 0.131}   # 7.5 deg
      - {metric: angle, from: robot::tcp, to: handle, axes: [x, y], le: 0.131}    # fingers across the bar
  - name: grasp                     # both fingers on the bar for 0.5 s
    timeout_s: 5.0
    done:
      - {metric: contacts, from: robot::fingers, to: handle, eq: 2, for_s: 0.5}
  - name: open                      # the drawer held 15 cm or more open for 1 s, without losing the grasp
    timeout_s: 15.0
    done:
      - {metric: joint, of: kitchen_counter::middle_slide_top, ge: 0.15, for_s: 1.0}
    while:
      - {metric: contacts, from: robot::fingers, to: handle, eq: 2}
      - {metric: slip, from: robot::tcp, to: handle, le: 0.013}
