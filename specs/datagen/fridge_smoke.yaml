# Smallest end-to-end run on the GPU box:
# 2 train + 1 held-out fridge-door demos through plan, repeat check, camera replay + bag and the LeRobot conversion.
task: open_fridge_door
robot: mobile_panda
out: runs/datagen/fridge_smoke
generator: {plugin: automoma, attempts: 5, checks: 1}
recorder: {plugin: rosetta}
converter: {plugin: rosetta, format: lerobot}
randomisers:
  robot_base: {x_m: [-0.15, 0.15], y_m: [-0.15, 0.15], yaw_deg: [-27, 27]}
seed: 0
splits:
  train:
    target: 2
    sampler: {strategy: random}
    pool: {initial: [0, 5], replacement: [6, 11]}
    record: true
  heldout:
    target: 1
    sampler: {strategy: sobol}
    pool: {initial: [500, 505]}
    min_distance: {from: train, value: 0.1, realised: true}
    record: false
