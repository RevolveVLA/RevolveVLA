[project]
name = "revolve_common"
version = "0.1.0"
description = "RevolveVLA shared code: spec schemas + loader, metric registry, job contract and HTTP entrypoint wrapper"
requires-python = ">=3.10"
dependencies = [
  "pydantic>=2.7,<3",
  "PyYAML>=6.0",
  "numpy>=1.26",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "docker>=7.1"]   # docker: the component tests launch containers

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["revolve_common"]
