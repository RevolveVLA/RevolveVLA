# MoveIt kinematics of the SO-101 arm group (../so101.srdf.xacro): pick_ik (PickNik's IK, a Lyrical binary). The arm
# has 5 DoF, so most 6-D poses have no exact solution: pick_ik minimises a weighted position + rotation cost and
# accepts a solution within the thresholds; with return_approximate_solution it returns the best one within the
# approximate_solution_* thresholds. Parameters: the pick_ik README's MoveIt example (global mode), rotation_scale 0.5.
arm:
  kinematics_solver: pick_ik/PickIkPlugin
  kinematics_solver_timeout: 0.05
  kinematics_solver_attempts: 3
  mode: global
  position_scale: 1.0
  rotation_scale: 0.5
  position_threshold: 0.001
  orientation_threshold: 0.01
  cost_threshold: 0.001
  minimal_displacement_weight: 0.0
  gd_step_size: 0.0001
