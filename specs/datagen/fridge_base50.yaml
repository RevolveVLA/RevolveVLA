# 50 train + 10 held-out fridge-door demos, base start varied around the planner's box centre (see
# components/datagen/src/datagen/plugins/randomisers/robot_base.py). `./revolve datagen specs/datagen/fridge_base50.yaml all`
task: open_fridge_door
robot: mobile_panda
out: runs/datagen/fridge_base50
generator: {plugin: automoma, attempts: 50, checks: 3}      # checks = N-of-N repeat replays of an accepted attempt
recorder: {plugin: rosetta}
converter: {plugin: rosetta, format: lerobot}
randomisers:
  robot_base: {x_m: [-0.15, 0.15], y_m: [-0.15, 0.15], yaw_deg: [-27, 27]}
seed: 0
splits:
  train:
    target: 50
    sampler:
      strategy: stratified
      bins: {robot_base.x_m: 3, robot_base.y_m: 3, robot_base.yaw_deg: 3}
    pool: {initial: [0, 99], replacement: [100, 199]}
    record: true
  heldout:
    target: 10
    sampler: {strategy: sobol}
    pool: {initial: [500, 529]}
    min_distance: {from: train, value: 0.1, realised: true}
    record: false
