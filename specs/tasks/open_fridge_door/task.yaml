# Open the fridge's top door: PartNet-Mobility 11211 (glass door, bar handle, hinge on its east side) in the
# PartNet kitchen. The door's hinge top_door_hinge: 0 closed, opens positive to 2.09 rad.
name: open_fridge_door
scene: kitchen_partnet
prompt: open the fridge door
targets:
  # the 12 x 14 x 250 mm bar (a collision on link top_door); its frame = the fridge's at the closed door:
  # x out of the fridge front, z up along the bar
  handle: fridge::top_door::top_door_handle
budget_s: 45.0                      # the whole episode [s]: the phase timeouts add up to 40 s
phases:
  - name: approach                  # drive + reach: the TCP on the bar, the gripper pointing into the door
    timeout_s: 20.0
    done:
      - {metric: distance, from: robot::tcp, to: handle, le: 0.015}
      - {metric: angle, from: robot::tcp, to: handle, axes: [z, -x], le: 0.131}   # 7.5 deg
      - {metric: angle, from: robot::tcp, to: handle, axes: [x, z], le: 0.131}    # fingers across the bar
  - name: grasp                     # both fingers on the bar for 0.5 s
    timeout_s: 5.0
    done:
      - {metric: contacts, from: robot::fingers, to: handle, eq: 2, for_s: 0.5}
  - name: open                      # the door held 60 deg or more open for 1 s, without losing the grasp
    timeout_s: 15.0
    done:
      - {metric: joint, of: fridge::top_door_hinge, ge: 1.047, for_s: 1.0}
    while:
      - {metric: contacts, from: robot::fingers, to: handle, eq: 2}
      - {metric: slip, from: robot::tcp, to: handle, le: 0.013}
