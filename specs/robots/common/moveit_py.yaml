# moveit_py (MoveItPy) options of every robot (linked from specs/robots/<r>/moveit/), as in the MoveIt 2
# motion_planning_python_api tutorial: the planning scene monitor on the robot's /joint_states, the OMPL and Pilz
# pipelines (their upstream configs), and named plan request parameters (`<name>.plan_request_params`, for
# PlanRequestParameters(moveit, "<name>")). RRTConnectkConfigDefault: a planner config of the Panda's upstream
# ompl_planning.yaml; with the pipeline defaults (the SO-101 robots) OMPL warns and uses its default, RRTConnect.
planning_scene_monitor_options:
  name: planning_scene_monitor
  robot_description: robot_description
  joint_state_topic: /joint_states
  attached_collision_object_topic: /moveit_cpp/planning_scene_monitor
  publish_planning_scene_topic: /moveit_cpp/publish_planning_scene
  monitored_planning_scene_topic: /moveit_cpp/monitored_planning_scene
  wait_for_initial_state_timeout: 10.0

planning_pipelines:
  pipeline_names: [ompl, pilz_industrial_motion_planner]

plan_request_params:
  planning_attempts: 1
  planning_pipeline: ompl
  planner_id: RRTConnectkConfigDefault
  planning_time: 2.0
  max_velocity_scaling_factor: 0.5
  max_acceleration_scaling_factor: 0.5

ompl_rrtc:
  plan_request_params:
    planning_attempts: 4
    planning_pipeline: ompl
    planner_id: RRTConnectkConfigDefault
    planning_time: 2.0
    max_velocity_scaling_factor: 0.5
    max_acceleration_scaling_factor: 0.5

pilz_lin:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: pilz_industrial_motion_planner
    planner_id: LIN
    planning_time: 2.0
    max_velocity_scaling_factor: 0.2
    max_acceleration_scaling_factor: 0.2

pilz_circ:
  plan_request_params:
    planning_attempts: 1
    planning_pipeline: pilz_industrial_motion_planner
    planner_id: CIRC
    planning_time: 2.0
    max_velocity_scaling_factor: 0.2
    max_acceleration_scaling_factor: 0.2
