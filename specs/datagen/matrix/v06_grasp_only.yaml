# Matrix variant: randomisers: grasp only (heldout min_distance dropped: distance ignores choices dims) (baseline: ../fridge_smoke.yaml). Outputs under runs/datagen_matrix/.
task: open_fridge_door
robot: mobile_panda
out: runs/datagen_matrix/v06_grasp_only
generator: {plugin: automoma, attempts: 10, checks: 1}
recorder: {plugin: rosetta}
converter: {plugin: rosetta, format: lerobot}
randomisers:
  grasp:
    id:
      choices: [0, 1, 2, 3, 4]
seed: 0
splits:
  train:
    target: 2
    sampler: {strategy: random}
    pool:
      initial: [0, 5]
      replacement: [6, 11]
    record: true
  heldout:
    target: 1
    sampler: {strategy: sobol}
    pool:
      initial: [500, 505]
    record: false
